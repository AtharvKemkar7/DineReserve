<h1 class="page-title">Restaurant settings</h1>
<form class="form" [formGroup]="form" (ngSubmit)="save()">
  <label>Name <input formControlName="name"></label>
  <label>Description <textarea formControlName="description"></textarea></label>
  <label>Address <input formControlName="address"></label>
  <label>Phone <input formControlName="phone"></label>
  <label>Opening hours <input formControlName="openingHours"></label>
  <label>Reservation policy <textarea formControlName="reservationPolicy"></textarea></label>
  <label>Default duration (minutes) <input type="number" formControlName="defaultDurationMinutes"></label>
  <label>Cancellation notice (hours) <input type="number" formControlName="cancellationHoursNotice"></label>
  <label>Open time <input type="time" formControlName="openTime"></label>
  <label>Close time <input type="time" formControlName="closeTime"></label>
  <p class="ok" *ngIf="message">{{ message }}</p>
  <button class="btn" type="submit">Save</button>
</form>
