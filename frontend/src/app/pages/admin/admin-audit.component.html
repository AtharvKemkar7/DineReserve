<h1 class="page-title">Audit logs</h1>
<div class="empty" *ngIf="!logs.length">No audit events yet.</div>
<table class="table" *ngIf="logs.length">
  <thead><tr><th>When</th><th>Action</th><th>Actor</th><th>Details</th></tr></thead>
  <tbody>
    <tr *ngFor="let log of logs">
      <td>{{ log.createdAt | date:'short' }}</td>
      <td>{{ log.action }}</td>
      <td>{{ log.actorEmail }}</td>
      <td>{{ log.details }}</td>
    </tr>
  </tbody>
</table>
