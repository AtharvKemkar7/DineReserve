<h1 class="page-title">Menu categories</h1>
<form class="form" [formGroup]="form" (ngSubmit)="create()">
  <label>Name <input formControlName="name"></label>
  <label>Description <input formControlName="description"></label>
  <label>Order <input type="number" formControlName="displayOrder"></label>
  <button class="btn" type="submit">Add category</button>
</form>
<table class="table" style="margin-top:16px">
  <thead><tr><th>Name</th><th>Description</th><th>Active</th><th></th></tr></thead>
  <tbody>
    <tr *ngFor="let item of categories">
      <td>{{ item.name }}</td>
      <td>{{ item.description }}</td>
      <td>{{ item.active ? 'Yes' : 'No' }}</td>
      <td><button class="btn danger" type="button" (click)="remove(item.id)">Delete</button></td>
    </tr>
  </tbody>
</table>
