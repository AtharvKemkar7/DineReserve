<h1 class="page-title">Menu items</h1>
<form class="form" [formGroup]="form" (ngSubmit)="create()">
  <label>Category
    <select formControlName="categoryId">
      <option value="">Select</option>
      <option *ngFor="let category of categories" [value]="category.id">{{ category.name }}</option>
    </select>
  </label>
  <label>Name <input formControlName="name"></label>
  <label>Description <input formControlName="description"></label>
  <label>Price <input type="number" step="0.01" formControlName="price"></label>
  <button class="btn" type="submit">Add item</button>
</form>
<table class="table" style="margin-top:16px">
  <thead><tr><th>Name</th><th>Category</th><th>Price</th><th>Available</th><th></th></tr></thead>
  <tbody>
    <tr *ngFor="let item of items">
      <td>{{ item.name }}</td>
      <td>{{ item.categoryName }}</td>
      <td>{{ item.price | currency }}</td>
      <td>{{ item.available ? 'Yes' : 'No' }}</td>
      <td><button class="btn danger" type="button" (click)="remove(item.id)">Delete</button></td>
    </tr>
  </tbody>
</table>
